# Render.com blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: sonicsentinel-ai
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /login
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: SEED_DEMO_USERS
        value: "1"
      - key: WARMUP_MODELS
        value: "1"
      - key: DATABASE_URL
        value: sqlite:////var/data/sonicsentinel.db
      - key: STORAGE_DIR
        value: /var/data/storage
    disk:
      name: sonicsentinel-data
      mountPath: /var/data
      sizeGB: 5
