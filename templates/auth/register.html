{% extends "auth/auth_base.html" %}
{% block title %}Create account{% endblock %}
{% block card %}
<h2>Create an account</h2>
<p class="sub">New accounts start as a normal user. An administrator can change your role later.</p>
<form method="post" autocomplete="on">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="field">
    <label for="full_name">Full name</label>
    <input id="full_name" name="full_name" value="{{ form.full_name }}" required autocomplete="name">
  </div>
  <div class="form-grid">
    <div class="field">
      <label for="username">Username</label>
      <input id="username" name="username" value="{{ form.username }}" required autocomplete="username" pattern="[A-Za-z0-9._]{3,40}">
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" value="{{ form.email }}" required autocomplete="email">
    </div>
    <div class="field">
      <label for="organization">Organisation</label>
      <input id="organization" name="organization" value="{{ form.organization }}" autocomplete="organization">
    </div>
    <div class="field">
      <label for="department">Department</label>
      <input id="department" name="department" value="{{ form.department }}">
    </div>
    <div class="field">
      <label for="phone">Phone <span class="muted">(optional)</span></label>
      <input id="phone" name="phone" value="{{ form.phone }}" autocomplete="tel">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required minlength="8" autocomplete="new-password">
      <span class="help">8+ characters with a letter and a number.</span>
    </div>
    <div class="field">
      <label for="confirm">Confirm password</label>
      <input id="confirm" name="confirm" type="password" required minlength="8" autocomplete="new-password">
    </div>
  </div>
  <label class="check"><input type="checkbox" name="consent" value="1" required> I have read the <a href="{{ url_for('auth.privacy') }}" target="_blank" rel="noopener">privacy notice</a> about audio and microphone use.</label>
  <button class="btn btn-primary btn-lg btn-block" type="submit">Create account</button>
</form>
<p class="mt-3 muted">Already registered? <a href="{{ url_for('auth.login') }}">Sign in</a>.</p>
{% endblock %}
