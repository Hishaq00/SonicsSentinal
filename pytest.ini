[pytest]
testpaths = tests
pythonpath = .
addopts = -q -ra
markers =
    model: needs the trained Python model in python_models/saved/
    dataset: needs the generated dataset in audio_dataset/
    ffmpeg: needs FFmpeg (bundled with imageio-ffmpeg)
    node: needs Node.js on PATH
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
    ignore::UserWarning
